let user=null,me=null,screen='dashboard',slipForPdf=null,authPane='login';
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PKR=x=>'PKR '+Number(x||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=x=>x?new Date(x).toLocaleDateString('en-PK',{timeZone:'Asia/Karachi'}):'—';
const datetime=x=>x?new Date(x).toLocaleString('en-PK',{timeZone:'Asia/Karachi'}):'—';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});
const uuid=()=>crypto.randomUUID();
function message(text,error=false){const el=document.getElementById('alert');if(el){el.className='msg'+(error?' error':'');el.textContent=text;el.classList.remove('hidden');el.scrollIntoView({block:'nearest',behavior:'smooth'})}else alert(text)}
function must(data){if(data?.error)throw new Error(data.error.message);return data?.data}
const rows=async(table,order='created_at')=>must(await sb.from(table).select('*').order(order,{ascending:false}));
const title=(h,p='')=>'<div class="top-row"><div><h1>'+E(h)+'</h1>'+(p?'<p class="muted">'+E(p)+'</p>':'')+'</div></div><div id="alert" class="msg hidden"></div>';
const field=(label,name,value='',type='text',opts='')=>'<label>'+E(label)+'<input type="'+type+'" name="'+E(name)+'" value="'+E(value)+'" '+opts+'></label>';
const projName=p=>p?E(p.name)+' #'+E(p.instance_number):'Project';
const btn=(action,id,label,kind='outline')=>'<button type="button" class="action-btn '+kind+'" data-action="'+E(action)+'" data-id="'+E(id)+'">'+E(label)+'</button>';
async function boot(){try{const session=await sb.auth.getSession();if(!session.data.session){user=null;me=null;renderAuth();return;}const got=await sb.auth.getUser();if(got.error||!got.data.user){await sb.auth.signOut();renderAuth();return;}user=got.data.user;await sb.rpc('claim_initial_admin');me=must(await sb.from('profiles').select('*').eq('id',user.id).single());if(me.must_change_password||location.hash.includes('type=recovery')){renderNewPassword();return;}if(!me.approved&&me.role!=='admin'){renderPending();return;}showShell();await show(screen);}catch(e){root.innerHTML='<div class="auth-scene"><div class="auth-card"><h1>Connection error</h1><p>'+E(e.message)+'</p><button data-action="retry">Retry</button></div></div>';}}
function renderAuth(){root.innerHTML='<div class="auth-scene"><section class="auth-card"><img class="brand-logo" alt="Maverick ConnectX logo" src="'+logo+'"><h1>'+(authPane==='signup'?'Staff registration':authPane==='recover'?'Recover your account':'Welcome back')+'</h1><p class="muted">'+(authPane==='signup'?'Registration is by invitation only.':'Secure staff management portal')+'</p><div id="alert" class="msg hidden"></div>'+(authPane==='signup'?'<form data-form="signup" class="stack">'+field('Full name','full_name','','text','required')+field('Invited email','email','','email','required')+field('Password (12+ characters)','password','','password','minlength="12" required')+'<button>Create account</button></form>':authPane==='recover'?'<form data-form="recover" class="stack">'+field('Registered email','email','','email','required')+'<button>Send recovery email</button></form><p class="small muted">If you forgot your email, contact an administrator with your Employee ID.</p>':'<form data-form="login" class="stack">'+field('Email','email','','email','required')+field('Password','password','','password','required')+'<button>Sign in</button></form>')+'<div class="auth-switch"><a data-auth="login">Sign in</a><a data-auth="signup">Register</a><a data-auth="recover">Forgot password?</a></div></section></div>';}
function renderPending(){root.innerHTML='<div class="auth-scene"><section class="auth-card"><img src="'+logo+'" class="brand-logo" alt="Logo"><h1>Awaiting admin approval</h1><p>Your employee account is permanently saved, but access to company pages is blocked until management approves your registration.</p><p><b>Employee ID: '+E(me.employee_code)+'</b></p><div id="alert" class="msg hidden"></div><button data-action="pending-profile">Complete my profile</button><button class="outline" data-action="logout">Sign out</button><div id="pending-body"></div></section></div>';}
function renderNewPassword(){root.innerHTML='<div class="auth-scene"><section class="auth-card"><img class="brand-logo" src="'+logo+'" alt="Logo"><h1>Change your password</h1><p class="muted">Choose a new password to continue.</p><div id="alert" class="msg hidden"></div><form class="stack" data-form="change-password">'+field('New password (12+ characters)','password','','password','minlength="12" required')+'<button>Update password</button></form><button data-action="logout" class="outline">Sign out</button></section></div>';}
const navItems=()=>[['dashboard','Dashboard'],['profile','My Profile'],['hours','Hours & Shifts'],['documents','Documents'],['slips','Pay Slips'],['notices','Notices'],...(me?.role==='admin'?[['staff','Employees & Profiles'],['projects','Projects & Teams'],['attendance','Attendance'],['finance','Finance & Reports'],['invites','Registration Access'],['recovery','Login Activity & Reset']]:me?.role==='manager'?[['attendance','Team Attendance']]:[])];
function showShell(){root.innerHTML='<div class="app-shell"><aside class="sidebar"><img class="brand-logo" alt="Maverick ConnectX logo" src="'+logo+'"><div class="current-account"><b>'+E(me.full_name||user.email)+'</b><div class="muted small">'+E(me.employee_code)+' · '+E(me.role.toUpperCase())+'</div></div><nav class="nav">'+navItems().map(([id,label])=>'<a href="#'+E(id)+'" data-page="'+E(id)+'" class="'+(screen===id?'active':'')+'">'+E(label)+'</a>').join('')+'</nav><p><button class="outline" style="width:100%" data-action="logout">Sign out</button></p></aside><main class="main" id="content">Loading…</main></div>'}
async function show(next){screen=next;const box=document.getElementById('content');if(!box)return;box.innerHTML=title('Loading…');document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===next));try{let html='';switch(next){case 'dashboard':html=await dashboard();break;case 'profile':html=await profilePage();break;case 'hours':html=await hoursPage();break;case 'documents':html=await documentsPage();break;case 'slips':html=await slipsPage();break;case 'notices':html=await noticesPage();break;case 'staff':if(me.role==='admin')html=await staffPage();break;case 'projects':if(me.role==='admin')html=await projectsPage();break;case 'attendance':if(['admin','manager'].includes(me.role))html=await attendancePage();break;case 'finance':if(me.role==='admin')html=await financePage();break;case 'invites':if(me.role==='admin')html=await invitesPage();break;case 'recovery':if(me.role==='admin')html=await recoveryPage();break;default:html=await dashboard()}box.innerHTML=html||title('No access');}catch(e){box.innerHTML=title('Unable to load')+'<div class="msg error">'+E(e.message)+'</div>'}}
async function dashboard(){const admin=me.role==='admin';const time=must(await sb.from('timesheets').select('*').order('work_date',{ascending:false}).limit(500));const hours=time.filter(t=>t.status==='approved').reduce((a,t)=>a+Number(t.approved_hours||0),0),earn=time.filter(t=>t.status==='approved').reduce((a,t)=>a+Number(t.approved_hours||0)*Number(t.rate_snapshot_pkr||0),0);const projects=admin?must(await sb.from('projects').select('id')):[];const notices=must(await sb.from('notices').select('*').order('created_at',{ascending:false}).limit(5));return title('Dashboard','Welcome, '+(me.full_name||'staff member'))+'<div class="grid"><div class="metric">'+(admin?'Projects':'Approved hours')+'<strong>'+(admin?projects.length:hours.toFixed(2))+'</strong></div><div class="metric">Pending hour entries<strong>'+time.filter(t=>t.status==='pending').length+'</strong></div><div class="metric">'+(admin?'Approved wages tracked':'Earned from approved hours')+'<strong>'+PKR(earn)+'</strong></div><div class="metric">Employee ID<strong>'+E(me.employee_code)+'</strong></div></div><section class="panel"><h2>Announcements</h2>'+(notices.length?notices.map(n=>'<p><b>'+E(n.title)+'</b><br>'+E(n.body)+'</p>').join(''):'<p>No announcements yet.</p>')+'</section>'}
async function profilePage(){return title('My Profile','You can update contact and emergency details; only admins set pay and schedules.')+'<section class="panel"><div class="grid"><p><b>Employee ID</b><br>'+E(me.employee_code)+'</p><p><b>Monthly salary reference</b><br>'+PKR(me.monthly_salary_pkr)+'</p><p><b>Hourly rate</b><br>'+PKR(me.hourly_rate_pkr)+'</p><p><b>Account</b><br><span class="pill '+(me.approved?'ok':'warn')+'">'+(me.approved?'Approved':'Pending approval')+'</span></p></div><form data-form="profile"><div class="form-grid">'+field('Full name','full_name',me.full_name,'text','required')+'<label>Position<select name="position"><option value="Employee" '+((me.position||'Employee')==='Employee'?'selected':'')+'>Employee</option><option value="Manager" '+(me.position==='Manager'?'selected':'')+'>Manager</option><option value="Owner" '+(me.position==='Owner'?'selected':'')+'>Owner</option></select></label>'+field('Phone number','phone',me.phone,'tel')+field('Home address','address',me.address)+field('Start date','start_date',me.start_date||'','date')+field('Emergency contact','emergency_contact',me.emergency_contact)+field('Emergency phone','emergency_phone',me.emergency_phone,'tel')+field('CNIC (private)','cnic',me.cnic||'')+'</div><button>Save my details</button></form></section>'}

async function noticesPage(){const notices=must(await sb.from('notices').select('*').order('created_at',{ascending:false}));return title('Company Announcements','Important messages from management.')+(me.role==='admin'?'<section class="panel"><h2>Publish notice</h2><form data-form="notice" class="stack">'+field('Title','title','','text','required')+'<label>Message<textarea name="body" required></textarea></label><button>Publish</button></form></section>':'')+'<section class="panel"><h2>Notices</h2>'+notices.map(n=>'<div style="padding:12px 0;border-bottom:1px solid #d2e4ef"><b>'+E(n.title)+'</b><p>'+E(n.body)+'</p><p class="small muted">'+E(datetime(n.created_at))+'</p></div>').join('')+(notices.length?'':'No notices yet.')+'</section>'}
async function invitesPage(){const invitations=must(await sb.from('staff_invitations').select('*').order('created_at',{ascending:false}));return title('Employee Registration Access','Only invited email addresses can create accounts. New registrations require admin approval.')+'<section class="panel"><h2>Invite employee or manager</h2><form data-form="invite" class="inline-form">'+field('Email address','email','','email','required')+'<button>Allow registration</button></form></section><section class="panel"><h2>Invitations</h2><div class="table-wrap"><table><tr><th>Email</th><th>Expires</th><th>Status</th><th>Action</th></tr>'+invitations.map(i=>'<tr><td>'+E(i.email)+'</td><td>'+E(date(i.expires_at))+'</td><td>'+(i.redeemed_at?'Registered':'Awaiting registration')+'</td><td>'+(i.redeemed_at?'—':btn('revoke-invite',i.email,'Revoke'))+'</td></tr>').join('')+'</table></div></section>'}
async function recoveryPage(){const [directory,log]=await Promise.all([sb.rpc('admin_staff_login_status').then(must),sb.from('login_activity').select('*').order('logged_in_at',{ascending:false}).limit(100).then(must)]);const options=directory.map(x=>'<option value="'+E(x.profile_id)+'">'+E(x.full_name)+' · '+E(x.employee_code)+'</option>').join('');return title('Login Activity & Password Reset','Authorized admins can review sign-ins and help an employee recover access.')+'<section class="panel"><h2>Reset employee password</h2><p>A temporary password replaces the old one immediately. It will be shown once, and the employee must change it at login.</p><form data-form="admin-reset" class="inline-form"><label>Staff account<select name="id">'+options+'</select></label><button>Reset password</button></form><div id="tempPassword" class="msg hidden"></div></section><section class="panel"><h2>Staff account history</h2><div class="table-wrap"><table><tr><th>Employee</th><th>ID</th><th>Registered email</th><th>Last sign-in</th><th>Recovery</th></tr>'+directory.map(x=>'<tr><td>'+E(x.full_name)+'</td><td>'+E(x.employee_code)+'</td><td>'+E(x.email)+'</td><td>'+E(datetime(x.last_sign_in_at))+'</td><td>'+btn('reset-email',x.email,'Send reset email')+'</td></tr>').join('')+'</table></div></section><section class="panel"><h2>Recent successful logins</h2><p class="small muted">Only sign-ins after tracking was enabled are listed.</p><div class="table-wrap"><table><tr><th>Account</th><th>Time</th></tr>'+log.map(e=>'<tr><td>'+E(directory.find(x=>x.profile_id===e.profile_id)?.full_name||'Staff')+'</td><td>'+E(datetime(e.logged_in_at))+'</td></tr>').join('')+'</table></div></section>'}
function payDate(work){const [y,m,d]=work.split('-').map(Number);if(d<=15)return y+'-'+String(m).padStart(2,'0')+'-20';return m===12?(y+1)+'-01-05':y+'-'+String(m+1).padStart(2,'0')+'-05'}
async function handleForm(kind,f,form,submitter){if(kind==='login'){const email=String(f.get('email')).trim(),password=String(f.get('password'));must(await sb.auth.signInWithPassword({email,password}));await boot();return;}if(kind==='signup'){const full_name=String(f.get('full_name')).trim(),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(password.length<12)throw Error('Password needs at least 12 characters');must(await sb.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:SITE}}));message('Account registration requested. Verify your email if asked, then sign in. Admin approval is also required.');return;}if(kind==='recover'){must(await sb.auth.resetPasswordForEmail(String(f.get('email')).trim(),{redirectTo:SITE}));message('If the email is registered, recovery instructions will be sent.');return;}if(kind==='change-password'){const password=String(f.get('password'));if(password.length<12)throw Error('Use a password of at least 12 characters');must(await sb.auth.updateUser({password}));must(await sb.rpc('confirm_my_password_change'));history.replaceState(null,'',SITE);await boot();return;}
if(kind==='profile'){must(await sb.rpc('update_my_profile',{p_name:String(f.get('full_name')||'').trim(),p_phone:String(f.get('phone')||''),p_address:String(f.get('address')||''),p_emergency_contact:String(f.get('emergency_contact')||''),p_emergency_phone:String(f.get('emergency_phone')||''),p_cnic:String(f.get('cnic')||'')||null,p_start_date:String(f.get('start_date')||'')||null,p_position:String(f.get('position')||'')}));me=must(await sb.from('profiles').select('*').eq('id',user.id).single());if(me.approved)await show('profile');else renderPending();message('Profile saved.');return;}
if(!me?.approved&&me?.role!=='admin')throw Error('Admin approval required');
if(kind==='staff'){if(me.role!=='admin')throw Error('Admin only');const id=form.dataset.id,rate=Number(f.get('hourly_rate_pkr')),monthly=Number(f.get('monthly_salary_pkr'));if(!Number.isFinite(rate)||rate<0||!Number.isFinite(monthly)||monthly<0)throw Error('Invalid pay rate');const updated={role:String(f.get('role')),approved:f.get('approved')==='on',hourly_rate_pkr:rate,monthly_salary_pkr:monthly,shift_start:String(f.get('shift_start')||'')||null,grace_minutes:Number(f.get('grace_minutes')||0),workdays:f.getAll('workdays').map(Number)};must(await sb.from('profiles').update(updated).eq('id',id));await show('staff');message('Employee settings saved.');return;}
if(kind==='project'){const name=String(f.get('name')||'').trim(),qty=Math.min(30,Math.max(1,Number(f.get('quantity')||1)));if(!name)throw Error('Enter a project name');const existing=must(await sb.from('projects').select('instance_number').ilike('name',name));const start=existing.reduce((m,x)=>Math.max(m,Number(x.instance_number)||0),0);must(await sb.from('projects').insert(Array.from({length:qty},(_,i)=>({name,instance_number:start+i+1}))));await show('projects');message('Projects created.');return;}
if(kind==='assignment'){const projectId=String(f.get('project_id')||''),choice=String(f.get('manager_id')||''),isOwner=choice==='owner:abrar',managerId=isOwner?'':choice,employeeId=String(f.get('employee_id')||''),share=isOwner?0:Number(f.get('manager_percent')||0);if(!choice&&!employeeId)throw Error('Choose an owner, manager, or employee');if(!Number.isFinite(share)||share<0||share>100)throw Error('Manager percentage must be between 0 and 100');const ids=[managerId,employeeId].filter(Boolean);const profiles=ids.length?must(await sb.from('profiles').select('id,role').in('id',ids)):[];if(managerId&&!profiles.some(p=>p.id===managerId&&p.role==='manager'))throw Error('Choose a registered manager');if(employeeId&&!profiles.some(p=>p.id===employeeId&&p.role==='employee'))throw Error('Choose a registered employee');if(isOwner){must(await sb.from('projects').update({owner_email:'abrar5600xt@gmail.com'}).eq('id',projectId));const existing=must(await sb.from('project_members').select('id').eq('project_id',projectId).eq('kind','manager'));if(existing.length)must(await sb.from('project_members').delete().in('id',existing.map(x=>x.id)));}else if(managerId){must(await sb.from('projects').update({owner_email:null}).eq('id',projectId));}const rows=[];if(managerId)rows.push({project_id:projectId,profile_id:managerId,kind:'manager',manager_percent:share});if(employeeId)rows.push({project_id:projectId,profile_id:employeeId,kind:'employee',manager_percent:0});if(rows.length)must(await sb.from('project_members').upsert(rows,{onConflict:'project_id,profile_id'}));await show('projects');message('Project assignments saved.');return;}
if(kind==='clockin'){must(await sb.from('shifts').insert({profile_id:user.id,project_id:f.get('project_id'),started_at:new Date().toISOString()}));await show('hours');message('Shift started.');return;}
if(kind==='hours'){const hours=Number(f.get('hours'));if(!Number.isFinite(hours)||hours<=0||hours>24)throw Error('Hours must be between 0 and 24');must(await sb.from('timesheets').insert({profile_id:user.id,project_id:f.get('project_id'),work_date:f.get('work_date'),submitted_hours:hours,notes:String(f.get('notes')||''),status:'pending'}));await show('hours');message('Hours submitted for admin approval.');return;}
if(kind==='approve'){if(me.role!=='admin')throw Error('Admin only');const status=submitter?.value||'approved',id=form.dataset.id,approved=Number(f.get('approved_hours'));if(!['approved','rejected'].includes(status)||approved<0||approved>24)throw Error('Invalid approval');const t=must(await sb.from('timesheets').select('profile_id,work_date,status').eq('id',id).single());if(t.status!=='pending')throw Error('This entry is already finalized');let rate=null;if(status==='approved'){const p=must(await sb.from('profiles').select('hourly_rate_pkr').eq('id',t.profile_id).single());rate=p.hourly_rate_pkr;}must(await sb.from('timesheets').update({status,approved_hours:status==='approved'?approved:null,rate_snapshot_pkr:rate,finalized_at:status==='approved'?new Date().toISOString():null,pay_date:status==='approved'?payDate(t.work_date):null}).eq('id',id));await show('attendance');message('Timesheet '+status+'.');return;}
if(kind==='income'||kind==='expense'){const amount=Number(f.get('amount_pkr'));if(amount<=0||!Number.isFinite(amount))throw Error('Amount must be positive');must(await sb.from(kind==='income'?'project_income':'project_expenses').insert({project_id:f.get('project_id'),[kind==='income'?'received_on':'expense_date']:f.get(kind==='income'?'received_on':'expense_date'),amount_pkr:amount,note:String(f.get('note')||'')}));await show('finance');message('Project '+kind+' recorded.');return;}
if(kind==='payout'){const type=String(f.get('recipient_type')),amount=Number(f.get('amount_pkr'));if(!['employee','manager','owner'].includes(type)||amount<=0)throw Error('Invalid payout');must(await sb.from('payouts').insert({project_id:f.get('project_id'),recipient_id:type==='owner'?null:f.get('recipient_id'),recipient_type:type,amount_pkr:amount,paid_on:f.get('paid_on'),note:String(f.get('note')||'')}));await show('finance');message('Payout recorded.');return;}
if(kind==='rent'){const amount=Number(f.get('amount_pkr')),paid=Number(f.get('paid_pkr'));if(amount<0||paid<0||paid>amount)throw Error('Invalid rent amount');must(await sb.from('manager_rent').upsert({manager_id:f.get('manager_id'),month:String(f.get('month'))+'-01',amount_pkr:amount,paid_pkr:paid},{onConflict:'manager_id,month'}));await show('finance');message('Rent saved.');return;}
if(kind==='upload'){const file=f.get('file'),person=String(f.get('profile_id'));if(!(file instanceof File)||file.size<=0||file.size>10*1024*1024)throw Error('Choose a file up to 10 MB');if(!['application/pdf','image/png','image/jpeg'].includes(file.type))throw Error('PDF/JPG/PNG only');const path=person+'/'+uuid()+'.'+(file.type==='application/pdf'?'pdf':file.type==='image/png'?'png':'jpg');must(await sb.storage.from('staff-documents').upload(path,file,{contentType:file.type,upsert:false}));must(await sb.from('staff_documents').insert({profile_id:person,storage_path:path,document_kind:file.type,title:String(f.get('title')||'Staff document'),assigned_by:user.id}));await show('documents');message('Document uploaded and assigned.');return;}
if(kind==='sign-doc'){if(f.get('accepted')!=='on')throw Error('You must read and acknowledge the document');must(await sb.rpc('sign_my_document',{p_id:form.dataset.id,p_name:String(f.get('signed_name'))}));await show('documents');message('Document signed.');return;}
if(kind==='finalize'){must(await sb.rpc('finalize_pay_slip',{p_profile_id:f.get('profile_id'),p_period_start:f.get('period_start'),p_period_end:f.get('period_end')}));await show('slips');message('Pay slip finalized. Release date is enforced automatically.');return;}
if(kind==='notice'){must(await sb.from('notices').insert({title:String(f.get('title')),body:String(f.get('body'))}));await show('notices');message('Notice published.');return;}
if(kind==='invite'){const email=String(f.get('email')||'').trim().toLowerCase();must(await sb.from('staff_invitations').insert({email,created_by:user.id}));await show('invites');message('Email permitted to register.');return;}
if(kind==='admin-reset'){if(me.role!=='admin')throw Error('Admin only');if(!confirm('Reset this employee password? The existing password will stop working.'))return;const result=await sb.functions.invoke('admin-reset-password',{body:{target_id:f.get('id')}});if(result.error||!result.data?.temporary_password)throw Error(result.error?.message||result.data?.error||'Password reset failed');const target=document.getElementById('tempPassword');target.textContent='New temporary password (visible once): '+result.data.temporary_password+' — share securely. Employee must change it at next login.';target.classList.remove('hidden');return;}
throw Error('Unknown action');}
root.addEventListener('submit',async event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await handleForm(form.dataset.form,new FormData(form),form,event.submitter)}catch(e){message(e.message||'Action failed',true)}finally{buttons.forEach(b=>b.disabled=false)}});
root.addEventListener('change',event=>{const el=event.target;if(el.matches('select[name="manager_id"]')){const form=el.closest('form[data-form="assignment"]');if(form){const isOwner=el.value==='owner:abrar';const sh=form.querySelector('[data-manager-share]'),info=form.querySelector('[data-owner-info]');if(sh)sh.style.display=isOwner?'none':'';if(info)info.style.display=isOwner?'':'none';}}});
document.addEventListener('click',async event=>{const auth=event.target.closest('[data-auth]');if(auth){event.preventDefault();authPane=auth.dataset.auth;renderAuth();return;}const nav=event.target.closest('[data-page]');if(nav){event.preventDefault();if(!me)return;await show(nav.dataset.page);return;}const button=event.target.closest('[data-action]');if(!button)return;event.preventDefault();const action=button.dataset.action,id=button.dataset.id;try{if(action==='logout'){await sb.auth.signOut();user=null;me=null;screen='dashboard';authPane='login';history.replaceState(null,'',SITE);renderAuth();}else if(action==='retry')await boot();else if(action==='pending-profile'){const box=document.getElementById('pending-body');if(box)box.innerHTML=await profilePage();}else if(action==='end-shift'){must(await sb.rpc('finish_my_shift',{p_id:id}));await show('hours');message('Shift ended.');}else if(action==='view-slip')await openSlip(id);else if(action==='close-slip'){document.getElementById('slipModal')?.remove();document.body.classList.remove('modal-open');slipForPdf=null;}else if(action==='download-slip')downloadSlip();else if(action==='revoke-invite'){if(!confirm('Revoke registration access for '+id+'?'))return;must(await sb.from('staff_invitations').delete().eq('email',id));await show('invites');message('Invitation revoked.');}else if(action==='reset-email'){if(!confirm('Send a recovery email to '+id+'?'))return;must(await sb.auth.resetPasswordForEmail(id,{redirectTo:SITE}));message('Password reset email requested.')}}catch(e){message(e.message||'Action failed',true)}});
await boot();

</script></body></html>
